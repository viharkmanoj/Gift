<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sorry Chelliammaa ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}html{-webkit-text-size-adjust:100%}
body{
  background:#05030a;
  font-family:Georgia,"Times New Roman",serif;
}
.scene{
  position:relative;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 58%,rgba(238,111,178,.13),transparent 24%),
    radial-gradient(circle at 50% 70%,rgba(116,67,145,.10),transparent 42%),
    linear-gradient(180deg,#03030a,#0b0612 58%,#030309);
}

/* subtle stars */
.stars{position:absolute;inset:0}
.star{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:#fff;opacity:.45;
  animation:twinkle 3s ease-in-out infinite;
}
@keyframes twinkle{50%{opacity:.08;transform:scale(.4)}}

/* only text */
.title{
  position:absolute;z-index:20;top:11%;
  width:100%;text-align:center;
  color:#f6d77a;
  font-size:clamp(38px,9vw,76px);
  font-weight:600;
  letter-spacing:.02em;
  text-shadow:
    0 0 8px rgba(255,215,100,.55),
    0 0 22px rgba(255,190,60,.35),
    0 2px 3px rgba(0,0,0,.7);
  animation:titleIn 2.5s ease both;
}
.title span{
  color:#ffd86b;
  text-shadow:0 0 15px rgba(255,205,80,.7);
}
@keyframes titleIn{
  from{opacity:0;transform:translateY(-18px)}
  to{opacity:1;transform:translateY(0)}
}

/* lotus glow */
.glow{
  position:absolute;z-index:1;
  width:430px;height:250px;
  left:50%;top:58%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,116,190,.18),transparent 68%);
  filter:blur(14px);
  animation:pulse 4s ease-in-out infinite;
}
@keyframes pulse{
  50%{transform:translate(-50%,-50%) scale(1.12);opacity:.72}
}

/* lotus */
.lotus{
  position:absolute;z-index:10;
  left:50%;top:54%;
  width:310px;height:270px;
  transform:translate(-50%,-50%);
  animation:float 5s ease-in-out 3s infinite;
}
@keyframes float{
  50%{transform:translate(-50%,-54%)}
}

.petal{
  position:absolute;
  left:50%;bottom:18px;
  width:78px;height:190px;
  transform-origin:50% 100%;
  border-radius:72% 72% 18% 18% / 92% 92% 15% 15%;
  background:linear-gradient(105deg,#bd5792 0%,#f6b0d1 48%,#fff0f6 62%,#d66aa6 100%);
  box-shadow:
    inset 0 0 16px rgba(255,255,255,.28),
    0 0 10px rgba(238,111,178,.08);
  opacity:0;
}
.petal:after{
  content:"";
  position:absolute;
  left:50%;top:8%;
  width:2px;height:75%;
  transform:translateX(-50%);
  background:linear-gradient(transparent,rgba(150,52,111,.24),transparent);
}

/* outer petals open first */
.p1{animation:bloom1 2.7s .9s cubic-bezier(.18,.9,.22,1) forwards}
.p2{animation:bloom2 2.7s 1s cubic-bezier(.18,.9,.22,1) forwards}
.p3{animation:bloom3 2.7s 1.1s cubic-bezier(.18,.9,.22,1) forwards}
.p4{animation:bloom4 2.7s 1.2s cubic-bezier(.18,.9,.22,1) forwards}
.p5{animation:bloom5 2.7s 1.3s cubic-bezier(.18,.9,.22,1) forwards}
.p6{animation:bloom6 2.7s 1.4s cubic-bezier(.18,.9,.22,1) forwards}
.p7{animation:bloom7 2.7s 1.5s cubic-bezier(.18,.9,.22,1) forwards}
.p8{animation:bloom8 2.7s 1.6s cubic-bezier(.18,.9,.22,1) forwards}

@keyframes bloom1{from{opacity:0;transform:translateX(-50%) rotate(0) scaleY(.02)}to{opacity:1;transform:translateX(-50%) rotate(-68deg) scaleY(1)}}
@keyframes bloom2{from{opacity:0;transform:translateX(-50%) rotate(0) scaleY(.02)}to{opacity:1;transform:translateX(-50%) rotate(-50deg) scaleY(1)}}
@keyframes bloom3{from{opacity:0;transform:translateX(-50%) rotate(0) scaleY(.02)}to{opacity:1;transform:translateX(-50%) rotate(-32deg) scaleY(1)}}
@keyframes bloom4{from{opacity:0;transform:translateX(-50%) rotate(0) scaleY(.02)}to{opacity:1;transform:translateX(-50%) rotate(-13deg) scaleY(1)}}
@keyframes bloom5{from{opacity:0;transform:translateX(-50%) rotate(0) scaleY(.02)}to{opacity:1;transform:translateX(-50%) rotate(13deg) scaleY(1)}}
@keyframes bloom6{from{opacity:0;transform:translateX(-50%) rotate(0) scaleY(.02)}to{opacity:1;transform:translateX(-50%) rotate(32deg) scaleY(1)}}
@keyframes bloom7{from{opacity:0;transform:translateX(-50%) rotate(0) scaleY(.02)}to{opacity:1;transform:translateX(-50%) rotate(50deg) scaleY(1)}}
@keyframes bloom8{from{opacity:0;transform:translateX(-50%) rotate(0) scaleY(.02)}to{opacity:1;transform:translateX(-50%) rotate(68deg) scaleY(1)}}

/* inner petals open after the outer petals */
.inner{
  width:64px;height:165px;
  bottom:20px;
  z-index:12;
  background:linear-gradient(105deg,#e27bb0,#ffe3ef 52%,#ee8dbb);
}
.i1{animation:inner1 2.5s 2.1s cubic-bezier(.18,.9,.22,1) forwards}
.i2{animation:inner2 2.5s 2.2s cubic-bezier(.18,.9,.22,1) forwards}
.i3{animation:inner3 2.5s 2.3s cubic-bezier(.18,.9,.22,1) forwards}
.i4{animation:inner4 2.5s 2.4s cubic-bezier(.18,.9,.22,1) forwards}

@keyframes inner1{from{opacity:0;transform:translateX(-50%) rotate(0) scaleY(.02)}to{opacity:1;transform:translateX(-50%) rotate(-27deg) scaleY(1)}}
@keyframes inner2{from{opacity:0;transform:translateX(-50%) rotate(0) scaleY(.02)}to{opacity:1;transform:translateX(-50%) rotate(-9deg) scaleY(1)}}
@keyframes inner3{from{opacity:0;transform:translateX(-50%) rotate(0) scaleY(.02)}to{opacity:1;transform:translateX(-50%) rotate(9deg) scaleY(1)}}
@keyframes inner4{from{opacity:0;transform:translateX(-50%) rotate(0) scaleY(.02)}to{opacity:1;transform:translateX(-50%) rotate(27deg) scaleY(1)}}

/* green lotus leaf */
.leaf{
  position:absolute;
  z-index:2;
  left:50%;
  bottom:-2px;
  width:285px;
  height:72px;
  transform:translateX(-50%) scale(.1);
  border-radius:50% 50% 45% 45%;
  background:
    radial-gradient(ellipse at 50% 15%,#4f8564 0%,#2f654e 38%,#173e34 76%,#0b2725 100%);
  box-shadow:
    inset 0 8px 15px rgba(125,190,135,.16),
    0 12px 25px rgba(0,0,0,.4);
  opacity:0;
  animation:leafIn 2s 2.7s cubic-bezier(.2,.9,.2,1) forwards;
}
.leaf:before{
  content:"";
  position:absolute;
  left:50%;
  top:8px;
  width:2px;
  height:56px;
  transform:translateX(-50%) rotate(2deg);
  background:rgba(152,205,145,.3);
  box-shadow:
    -38px 12px 0 -1px rgba(152,205,145,.16),
    38px 12px 0 -1px rgba(152,205,145,.16);
}
@keyframes leafIn{
  70%{opacity:1;transform:translateX(-50%) scale(1.06)}
  to{opacity:1;transform:translateX(-50%) scale(1)}
}

/* flower center */
.center{
  position:absolute;z-index:15;
  left:50%;bottom:24px;
  width:52px;height:52px;
  transform:translateX(-50%) scale(.05);
  border-radius:50%;
  background:radial-gradient(circle,#fff3a8 0 12%,#f4c15b 14% 45%,#ca7547 47%);
  box-shadow:0 0 28px rgba(255,211,107,.45);
  animation:centerIn 1.5s 3.1s cubic-bezier(.2,.9,.2,1) forwards;
}
@keyframes centerIn{
  70%{transform:translateX(-50%) scale(1.12)}
  to{transform:translateX(-50%) scale(1)}
}

/* soft floating specks */
.particle{
  position:absolute;z-index:7;
  width:4px;height:4px;border-radius:50%;
  background:#ffd8e9;
  box-shadow:0 0 12px rgba(255,170,214,.8);
  opacity:0;
  animation:rise 5s linear infinite;
}
@keyframes rise{
  0%{opacity:0;transform:translateY(40px) scale(.4)}
  20%{opacity:.65}
  100%{opacity:0;transform:translateY(-190px) translateX(35px) scale(.1)}
}

/* consistent responsive composition */
.title{
  top:clamp(28px,9vh,90px);
  padding:0 16px;
}

.lotus{
  top:54%;
  width:310px;
  height:270px;
}

.glow{
  top:58%;
  width:min(430px,92vw);
  height:min(250px,54vw);
}

.leaf{
  bottom:0;
  width:min(285px,72vw);
  height:min(72px,18vw);
}

/* phones */
@media(max-width:700px){
  .title{
    top:7vh;
    font-size:clamp(30px,10vw,52px);
  }

  .lotus{
    top:54%;
    transform:translate(-50%,-50%) scale(.72);
  }

  .glow{
    top:58%;
    transform:translate(-50%,-50%) scale(.78);
  }

  .leaf{
    transform:translateX(-50%) scale(.82);
    transform-origin:bottom center;
  }
}

/* very short screens */
@media(max-height:650px){
  .title{
    top:3vh;
    font-size:clamp(28px,8vw,50px);
  }

  .lotus{
    top:57%;
    transform:translate(-50%,-50%) scale(.58);
  }

  .glow{
    top:61%;
    transform:translate(-50%,-50%) scale(.65);
  }

  .leaf{
    transform:translateX(-50%) scale(.70);
    transform-origin:bottom center;
  }
}

/* landscape phones */
@media(orientation:landscape) and (max-height:520px){
  .title{
    top:2.5vh;
    font-size:clamp(24px,6vw,42px);
  }

  .lotus{
    top:59%;
    transform:translate(-50%,-50%) scale(.48);
  }

  .glow{
    top:62%;
    transform:translate(-50%,-50%) scale(.55);
  }

  .leaf{
    transform:translateX(-50%) scale(.58);
  }
}

@supports (height:100dvh){
  html,body,.scene{
    height:100dvh;
  }
}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="stars" id="stars"></div>

  <div class="title"><div>Sorry</div><div>Chelliammaa <span>❤️</span></div></div>

  <div class="glow"></div>

  <div class="lotus">
    <div class="petal p1"></div>
    <div class="petal p2"></div>
    <div class="petal p3"></div>
    <div class="petal p4"></div>
    <div class="petal p5"></div>
    <div class="petal p6"></div>
    <div class="petal p7"></div>
    <div class="petal p8"></div>

    <div class="petal inner i1"></div>
    <div class="petal inner i2"></div>
    <div class="petal inner i3"></div>
    <div class="petal inner i4"></div>

    <div class="leaf"></div>
    <div class="center"></div>
  </div>
</div>

<script>
const stars=document.getElementById("stars");
for(let i=0;i<95;i++){
  const s=document.createElement("i");
  s.className="star";
  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*78+"%";
  s.style.animationDelay=(Math.random()*3)+"s";
  s.style.opacity=.15+Math.random()*.65;
  stars.appendChild(s);
}
const scene=document.getElementById("scene");
for(let i=0;i<20;i++){
  const p=document.createElement("i");
  p.className="particle";
  p.style.left=(25+Math.random()*50)+"%";
  p.style.top=(55+Math.random()*28)+"%";
  p.style.animationDelay=(Math.random()*5)+"s";
  p.style.animationDuration=(4+Math.random()*4)+"s";
  scene.appendChild(p);
}
</script>
</body>
</html>
