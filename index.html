<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Apology for You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #1b0f24 0%, #09040d 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        /* Ambient floating particles background */
        .sparkles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .sparkle {
            position: absolute;
            background: #ffb7c5;
            border-radius: 50%;
            opacity: 0.6;
            animation: floatParticle 6s infinite ease-in-out;
        }

        @keyframes floatParticle {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
            50% { transform: translateY(-40px) scale(1.3); opacity: 0.8; }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* Lotus Flower Styling */
        .lotus-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lotus {
            position: relative;
            width: 100px;
            height: 100px;
            animation: gentleFloat 4s ease-in-out infinite alternate;
        }

        @keyframes gentleFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-10px) rotate(2deg); }
        }

        /* Lotus Petals */
        .petal {
            position: absolute;
            bottom: 30px;
            left: 50%;
            width: 36px;
            height: 90px;
            background: linear-gradient(135deg, #ff9bbd 0%, #ff4b8b 100%);
            border-radius: 50% 50% 20% 20%;
            transform-origin: bottom center;
            opacity: 0.95;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
            animation: bloom 3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Petal Layering & Rotation for Blooming Effect */
        .petal.inner-1 { transform: translateX(-50%) rotate(0deg) scale(0.8); animation-delay: 0.2s; background: linear-gradient(135deg, #ffb3cc 0%, #ff6699 100%); }
        .petal.inner-2 { transform: translateX(-50%) rotate(30deg) scale(0.85); animation-delay: 0.4s; }
        .petal.inner-3 { transform: translateX(-50%) rotate(-30deg) scale(0.85); animation-delay: 0.4s; }
        
        .petal.mid-1 { transform: translateX(-50%) rotate(55deg); animation-delay: 0.6s; }
        .petal.mid-2 { transform: translateX(-50%) rotate(-55deg); animation-delay: 0.6s; }
        .petal.mid-3 { transform: translateX(-50%) rotate(20deg); animation-delay: 0.8s; }
        .petal.mid-4 { transform: translateX(-50%) rotate(-20deg); animation-delay: 0.8s; }

        .petal.outer-1 { transform: translateX(-50%) rotate(80deg) scale(0.9); animation-delay: 1s; background: linear-gradient(135deg, #ff85b3 0%, #e6005c 100%); }
        .petal.outer-2 { transform: translateX(-50%) rotate(-80deg) scale(0.9); animation-delay: 1s; background: linear-gradient(135deg, #ff85b3 0%, #e6005c 100%); }
        .petal.outer-3 { transform: translateX(-50%) rotate(45deg); animation-delay: 1.2s; }
        .petal.outer-4 { transform: translateX(-50%) rotate(-45deg); animation-delay: 1.2s; }

        @keyframes bloom {
            0% {
                transform: translateX(-50%) rotate(0deg) scale(0.1);
                opacity: 0;
            }
            100% {
                opacity: 0.95;
            }
        }

        /* Lotus Center Glow */
        .lotus-core {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #fff380 0%, #ffcc00 100%);
            border-radius: 50%;
            box-shadow: 0 0 25px #ffea75;
            animation: coreGlow 3s ease-in-out infinite alternate;
            z-index: 10;
        }

        @keyframes coreGlow {
            0% { transform: translateX(-50%) scale(0.9); box-shadow: 0 0 15px #ffcc00; }
            100% { transform: translateX(-50%) scale(1.1); box-shadow: 0 0 30px #ffee55; }
        }

        /* Water Base / Ripple Effect */
        .base-water {
            position: absolute;
            bottom: -10px;
            width: 160px;
            height: 15px;
            background: rgba(255, 153, 204, 0.2);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.3);
            animation: pulseRipple 3s infinite ease-in-out;
        }

        @keyframes pulseRipple {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        /* Typography Styling */
        .message-box {
            opacity: 0;
            transform: translateY(20px);
            animation: revealText 1.5s ease 1.8s forwards;
        }

        @keyframes revealText {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: clamp(2rem, 4vw, 3.2rem);
            font-weight: 600;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff 0%, #ffb6c1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: #d8b4e2;
            max-width: 450px;
            line-height: 1.6;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <div class="sparkles" id="sparkles"></div>

    <div class="container">
        <div class="lotus-container">
            <div class="lotus">
                <div class="petal inner-1"></div>
                <div class="petal inner-2"></div>
                <div class="petal inner-3"></div>
                
                <div class="petal mid-1"></div>
                <div class="petal mid-2"></div>
                <div class="petal mid-3"></div>
                <div class="petal mid-4"></div>

                <div class="petal outer-1"></div>
                <div class="petal outer-2"></div>
                <div class="petal outer-3"></div>
                <div class="petal outer-4"></div>

                <div class="lotus-core"></div>
            </div>
            <div class="base-water"></div>
        </div>

        <div class="message-box">
            <h1>Sorry, Chelliammaa</h1>
            <p>Just like this lotus blooming through the water, I hope you can find it in your heart to forgive me. You mean the absolute world to me.</p>
        </div>
    </div>

    <script>
        // Generate dynamic floating background sparkles
        const sparklesContainer = document.getElementById('sparkles');
        const numberOfSparkles = 35;

        for (let i = 0; i < numberOfSparkles; i++) {
            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            
            // Random positioning and sizing
            sparkle.style.left = `${Math.random() * 100}%`;
            sparkle.style.top = `${Math.random() * 100}%`;
            
            const size = Math.random() * 4 + 2;
            sparkle.style.width = `${size}px`;
            sparkle.style.height = `${size}px`;
            
            // Random animation delay and duration
            sparkle.style.animationDuration = `${Math.random() * 3 + 3}s`;
            sparkle.style.animationDelay = `${Math.random() * 3}s`;
            
            sparklesContainer.appendChild(sparkle);
        }
    </script>
</body>
</html>
